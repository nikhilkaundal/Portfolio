<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark night -->
  <rect width="64" height="64" rx="12" fill="#0A0A0B"/>

  <!-- Amber accent top-left corner line -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="#C05800" stroke-width="2" stroke-linecap="round"/>

  <!-- N letter -->
  <text
    x="9"
    y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="700"
    fill="#E8E4DD"
    letter-spacing="-1"
  >N</text>

  <!-- K letter -->
  <text
    x="31"
    y="42"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="700"
    fill="#E8E4DD"
    letter-spacing="-1"
  >K</text>

  <!-- Amber dot — brand signature mark -->
  <circle cx="55" cy="50" r="3.5" fill="#FF7A1A"/>

  <!-- Bottom accent line -->
  <line x1="9" y1="50" x2="48" y2="50" stroke="#C05800" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
