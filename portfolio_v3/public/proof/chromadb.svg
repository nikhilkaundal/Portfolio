<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Blue circle (left) -->
  <circle cx="35" cy="50" r="32" fill="#4A90D9" opacity="0.9"/>
  <!-- Yellow circle (right) -->
  <circle cx="65" cy="50" r="32" fill="#F5C518" opacity="0.9"/>
  <!-- Red/Orange center overlap (rendered as a shape using clipPath) -->
  <clipPath id="right-clip">
    <circle cx="65" cy="50" r="32"/>
  </clipPath>
  <circle cx="35" cy="50" r="32" fill="#E8522A" opacity="1" clip-path="url(#right-clip)"/>
</svg>
